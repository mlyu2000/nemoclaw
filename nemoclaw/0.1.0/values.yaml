# NemoClaw PCAI Helm chart — pick ONE agent: openclaw (default) or hermes.
# Mutually exclusive: exactly one agent container per pod.
# Both agents can use the same Telegram bot token (top-level telegram.* block)
# and the same LiteLLM endpoint.
#
# Backward-compatible: default agent = openclaw (the prior chart behavior).

replicaCount: 1

# ── Agent selector ───────────────────────────────────────────────────────────
# Exactly one of:
#   openclaw  — NemoClaw / OpenClaw gateway (dashboard on port 18789, LLM via
#               litellm, Telegram via openclaw channel).
#   hermes    — Hermes Agent (Nous Research, OpenAI-compatible API on port
#               8642 + web dashboard on port 18790, Telegram via hermes
#               platform). Uses the NemoClaw Hermes sandbox image.
agent: openclaw

# ── Container image (OpenClaw) ───────────────────────────────────────────────
image:
  repository: ghcr.io/nvidia/openshell-community/sandboxes/openclaw
  tag: latest
  digest: sha256:b3d832b596ab6b7184a9dcb4ae93337ca32851a4f93b00765cc12de26baa3a9a
  pullPolicy: IfNotPresent

# ── Gateway (OpenClaw dashboard) ─────────────────────────────────────────────
gateway:
  port: 18789
  bind: lan
  token: "CHANGE_ME-GENERATED-AT-DEPLOY"
  dangerouslyDisableDeviceAuth: true
  allowedOrigins: "*"

# ── LLM endpoint (PCAI internal LiteLLM) ─────────────────────────────────────
litellm:
  baseUrl: "http://litellm-helm.<litellm-namespace>.svc.cluster.local:4000/v1"
  model: "qwen3-8-27b-int4-dflash2-r2"
  contextWindow: 131072
  maxTokens: 8192
  apiKey: "***"
  keyRef:
    namespace: "<litellm-namespace>"
    secret: "litellm-helm-masterkey"
    key: "masterkey"

# ── Dashboard UI root (OpenClaw only) ────────────────────────────────────────
ui:
  root: "/sandbox/.openclaw/ui"

domain:
  base: "<your-pcai-domain>"
  istioGateway: "istio-system/ezaf-gateway"

# ── Telegram (shared by both agents) ─────────────────────────────────────────
telegram:
  enabled: true
  allowAll: true
  botToken: "CHANGE_ME-telegram-bot-token"
  testChatId: ""
  testMessage: "NemoClaw Telegram channel is online (one-off validation)"

# ── Hermes Agent (used when agent: hermes) ───────────────────────────────────
hermes:
  image:
    repository: ghcr.io/nvidia/nemoclaw/hermes-sandbox
    tag: latest
    digest: sha256:0d07845fa3b02a0657d28e134eb2e1f4a96cc6260e2538f3d4eafe831c7e5c17
    pullPolicy: IfNotPresent
  apiPort: 8642
  dashboardPort: 18790
  dashboardInternalPort: 19119
  apiServerKey: "CHANGE_ME-HERMES-API-KEY"
  model: "qwen3-8-27b-int4-dflash2-r2"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 18789
  hermesApiPort: 8642
  hermesDashboardPort: 18790

ingress:
  enabled: true

ezua:
  virtualService:
    endpoint: "nemoclaw.<your-pcai-domain>"
    istioGateway: "istio-system/ezaf-gateway"

persistence:
  enabled: true
  storageClassName: "<pcai-storageclass>"
  size: 10Gi

# ── Resources (OpenClaw gateway) ────────────────────────────────────────────
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

istioInjection: true

ezapp:
  enabled: true
  namespace: ui
  createNamespace: "false"
  appName: nemoclaw
  label: NemoClaw
  description: "NemoClaw / Hermes Agent — single-agent PCAI deployment with Telegram channel."
  category: dataScience
  timeout: 45m
  backoffLimit: 3
