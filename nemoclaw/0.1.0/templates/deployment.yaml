apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nemoclaw.fullname" . }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nemoclaw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nemoclaw.selectorLabels" . | nindent 8 }}
        {{- if not .Values.istioInjection }}
        sidecar.istio.io/inject: "false"
        {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 998
        runAsGroup: 998
        fsGroup: 998
      {{- if eq .Values.agent "openclaw" }}
      containers:
        - name: nemoclaw
          image: {{ include "nemoclaw.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              STATE=/sandbox/.openclaw
              mkdir -p "$STATE/agents/main/agent" "$STATE/workspace"
              cp /etc/openclaw-config/openclaw.json "$STATE/openclaw.json"
              chmod 600 "$STATE/openclaw.json"
              UI=/usr/lib/node_modules/openclaw/dist/control-ui
              mkdir -p "{{ .Values.ui.root }}"
              cp -r "$UI/." "{{ .Values.ui.root }}/"
              node /etc/openclaw-config/patch-ui.js "{{ .Values.ui.root }}" "$(cat /etc/gateway-token)"
              {{- if .Values.telegram.enabled }}
              node /etc/openclaw-config/telegram-verify.js >> /sandbox/.openclaw/telegram-verify.log 2>&1 || true
              {{- end }}
              exec openclaw gateway run                 --bind {{ .Values.gateway.bind }}                 --port {{ .Values.gateway.port }}                 --token "$(cat /etc/gateway-token)"
          env:
            - name: HOME
              value: /sandbox
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemoclaw.fullname" . }}-gateway-token
                  key: token
            {{- if .Values.telegram.enabled }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemoclaw.fullname" . }}-gateway-token
                  key: telegram-bot-token
            {{- with .Values.telegram.testChatId }}
            - name: TELEGRAM_TEST_CHAT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: TELEGRAM_TEST_MESSAGE
              value: {{ .Values.telegram.testMessage | quote }}
            {{- end }}
          ports:
            - name: dashboard
              containerPort: {{ .Values.gateway.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: openclaw-config
              mountPath: /etc/openclaw-config
              readOnly: true
            - name: gateway-token
              mountPath: /etc/gateway-token
              subPath: token
              readOnly: true
            - name: agent-state
              mountPath: /sandbox/.openclaw
      {{- else if eq .Values.agent "hermes" }}
      containers:
        - name: hermes
          image: {{ include "hermes.image" . }}
          imagePullPolicy: {{ .Values.hermes.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 998
            runAsGroup: 998
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              HERMES_HOME=/sandbox/.hermes
              mkdir -p "$HERMES_HOME"
              bash /etc/openclaw-config/seed-hermes-config.sh
              if [ -f /usr/local/lib/nemoclaw/hermes-start.sh ]; then
                source /usr/local/lib/nemoclaw/hermes-start.sh
                exec nemoclaw_hermes_start
              fi
              exec hermes gateway run \
                --api-port {{ .Values.hermes.apiPort }} \
                --dashboard-port {{ .Values.hermes.dashboardPort }} \
                --dashboard-internal-port {{ .Values.hermes.dashboardInternalPort }} \
                --api-server-key "$(cat /etc/hermes-api-key)" \
                --model "{{ .Values.hermes.model }}" \
                --litellm-base-url "{{ .Values.litellm.baseUrl }}" \
                --litellm-api-key "$(cat /etc/litellm-api-key)" \
                --litellm-model "{{ .Values.litellm.model }}" \
                {{- if .Values.telegram.enabled }}
                --telegram \
                --telegram-bot-token "$(cat /etc/telegram-bot-token)" \
                {{- end }}
          env:
            - name: HOME
              value: /sandbox
            - name: HERMES_HOME
              value: /sandbox/.hermes
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemoclaw.fullname" . }}-gateway-token
                  key: hermes-api-key
            - name: HERMES_MODEL
              value: {{ .Values.hermes.model | quote }}
            - name: NEMOCLAW_INFERENCE_BASE_URL
              value: {{ .Values.litellm.baseUrl | quote }}
            - name: NEMOCLAW_MODEL
              value: {{ .Values.litellm.model | quote }}
            - name: NEMOCLAW_INFERENCE_PROVIDER_ID
              value: "custom"
            {{- if .Values.telegram.enabled }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "nemoclaw.fullname" . }}-gateway-token
                  key: telegram-bot-token
            {{- with .Values.telegram.testChatId }}
            - name: TELEGRAM_TEST_CHAT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: TELEGRAM_TEST_MESSAGE
              value: {{ .Values.telegram.testMessage | quote }}
            {{- end }}
          ports:
            - name: hermes-api
              containerPort: {{ .Values.hermes.apiPort }}
              protocol: TCP
            - name: hermes-dashboard
              containerPort: {{ .Values.hermes.dashboardPort }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  CODE=$(curl -so /dev/null -w '%{http_code}' --max-time 2 \
                    "http://127.0.0.1:{{ .Values.hermes.apiPort }}/health" 2>/dev/null || echo 000)
                  [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || exit 1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  CODE=$(curl -so /dev/null -w '%{http_code}' --max-time 2 \
                    "http://127.0.0.1:{{ .Values.hermes.apiPort }}/health" 2>/dev/null || echo 000)
                  [ "$CODE" = "200" ] || [ "$CODE" = "401" ] || exit 1
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.hermes.resources | nindent 12 }}
          volumeMounts:
            - name: openclaw-config
              mountPath: /etc/openclaw-config
              readOnly: true
            - name: gateway-token
              mountPath: /etc/hermes-api-key
              subPath: hermes-api-key
              readOnly: true
            - name: gateway-token
              mountPath: /etc/litellm-api-key
              subPath: litellm-api-key
              readOnly: true
            - name: gateway-token
              mountPath: /etc/telegram-bot-token
              subPath: telegram-bot-token
              readOnly: true
            - name: agent-state
              mountPath: /sandbox/.hermes
              subPath: hermes
      {{- end }}
      volumes:
        - name: openclaw-config
          configMap:
            name: {{ include "nemoclaw.fullname" . }}-openclaw-config
        - name: gateway-token
          secret:
            secretName: {{ include "nemoclaw.fullname" . }}-gateway-token
        - name: agent-state
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "nemoclaw.fullname" . }}-agent-state
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
