# Static gateway token. Baked at deploy time so it persists and is retrievable
# without a manual curl. The ConfigMap (openclaw.json) is rendered from the same
# value, so the dashboard URL + token the portal shows are exactly the gateway's.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemoclaw.fullname" . }}-gateway-token
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.gateway.token | quote }}
