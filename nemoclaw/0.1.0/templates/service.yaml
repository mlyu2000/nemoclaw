apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemoclaw.serviceName" . }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nemoclaw.selectorLabels" . | nindent 4 }}
  ports:
    {{- if eq .Values.agent "openclaw" }}
    - name: dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- else if eq .Values.agent "hermes" }}
    - name: hermes-dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.hermesDashboardPort }}
      protocol: TCP
    - name: hermes-api
      port: {{ .Values.service.hermesApiPort }}
      targetPort: {{ .Values.hermes.apiPort }}
      protocol: TCP
    {{- end }}
