apiVersion: v1
kind: Service
metadata:
  name: {{ include "nemoclaw.serviceName" . }}
  labels:
    {{- include "nemoclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nemoclaw.selectorLabels" . | nindent 4 }}
  ports:
    - name: dashboard
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
